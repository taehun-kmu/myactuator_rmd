name: Tests

on:
  push:
    paths:
      - 'bindings/**'
      - 'include/**'
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      VCAN_IFNAME: vcan_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y can-utils iproute2 linux-modules-extra-$(uname -r)
          sudo apt-get install -y python3 python3-pybind11
          sudo apt-get install -y libboost-all-dev libgmock-dev libgtest-dev
          sudo apt-get install -y clang-format gcovr
          
      - name: Create build directory
        run: mkdir -p ${GITHUB_WORKSPACE}/build
        
      - name: Configure project with CMake
        run: |
          cmake -B ${GITHUB_WORKSPACE}/build -S ${GITHUB_WORKSPACE} \
            -D PYTHON_BINDINGS=on \
            -D BUILD_TESTING=on \
            -D ENABLE_COVERAGE=on
            
      - name: Check code formatting
        run: |
          echo "::group::Running format check"
          make -C ${GITHUB_WORKSPACE}/build format-check
          echo "::endgroup::"
        continue-on-error: false
        
      - name: Build project with strict warnings
        run: |
          echo "::group::Compiling with strict warning flags"
          make -j $(nproc) -C ${GITHUB_WORKSPACE}/build
          echo "::endgroup::"
        continue-on-error: false
        
      - name: Set up virtual CAN interface
        run: |
          echo "::group::Setting up test environment"
          sudo modprobe vcan
          sudo ip link add dev ${VCAN_IFNAME} type vcan
          sudo ip link set up ${VCAN_IFNAME}
          echo "::endgroup::"
          
      - name: Run unit tests
        run: |
          echo "::group::Running unit tests"
          cd ${GITHUB_WORKSPACE}/build && ctest --verbose
          echo "::endgroup::"
        continue-on-error: false
        
      - name: Generate code coverage report
        run: |
          echo "::group::Generating coverage report"
          gcovr -j $(nproc) \
            --filter ${GITHUB_WORKSPACE}/include \
            --filter ${GITHUB_WORKSPACE}/src \
            --print-summary \
            --xml-pretty \
            --xml ${GITHUB_WORKSPACE}/build/coverage.xml
          echo "::endgroup::"
        if: success()
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${GITHUB_WORKSPACE}/build/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        if: success()
        
      - name: Clean up virtual CAN interface
        run: |
          echo "::group::Cleaning up test environment"
          sudo ip link set down ${VCAN_IFNAME} || true
          sudo ip link delete ${VCAN_IFNAME} || true
          echo "::endgroup::"
        if: always()
