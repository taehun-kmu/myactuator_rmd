name: Debug Tests

on:
  push:
    paths:
      - 'include/**/*debug*'
      - 'include/**/*DCHECK*'
      - 'test/debug_checks_test.cpp'
      - 'test/**/*debug*'
      - 'src/**/*debug*'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'include/**/*debug*'
      - 'include/**/*DCHECK*'
      - 'test/debug_checks_test.cpp'
      - 'test/**/*debug*'
      - 'src/**/*debug*'
      - 'CMakeLists.txt'
  schedule:
    - cron: "0 9 * * *"  # Daily at 9 AM UTC
  workflow_dispatch:

jobs:
  run-debug-tests:
    runs-on: ubuntu-latest
    env:
      VCAN_IFNAME: vcan_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          sudo apt-get install -y can-utils iproute2 linux-modules-extra-$(uname -r)
          sudo apt-get install -y python3 python3-pybind11
          sudo apt-get install -y libboost-all-dev libgmock-dev libgtest-dev
          sudo apt-get install -y clang-format
          
      - name: Create build directory
        run: mkdir -p ${GITHUB_WORKSPACE}/build
        
      - name: Configure project with CMake (Debug build)
        run: |
          cmake -B ${GITHUB_WORKSPACE}/build -S ${GITHUB_WORKSPACE} \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Debug \
            -D PYTHON_BINDINGS=on \
            -D BUILD_TESTING=on \
            -D ENABLE_COVERAGE=off
            
      - name: Check code formatting
        run: |
          echo "::group::Running format check"
          ninja -C ${GITHUB_WORKSPACE}/build format-check
          echo "::endgroup::"
        continue-on-error: false
        
      - name: Build project with debug symbols
        run: |
          echo "::group::Compiling with debug symbols and DCHECK enabled"
          ninja -j $(nproc) -C ${GITHUB_WORKSPACE}/build
          echo "::endgroup::"
        continue-on-error: false
        
      - name: Set up virtual CAN interface
        run: |
          echo "::group::Setting up test environment"
          sudo modprobe vcan
          sudo ip link add dev ${VCAN_IFNAME} type vcan
          sudo ip link set up ${VCAN_IFNAME}
          echo "::endgroup::"
          
      - name: Run debug tests (DCHECK enabled)
        run: |
          echo "::group::Running debug tests with DCHECK validation"
          cd ${GITHUB_WORKSPACE}/build && ./run_debug_tests --gtest_output=xml:debug_results.xml
          echo "::endgroup::"
        continue-on-error: false
        
      - name: Validate DCHECK performance (should be fast in debug)
        run: |
          echo "::group::Performance validation for debug assertions"
          cd ${GITHUB_WORKSPACE}/build
          # Run a subset of performance-sensitive tests to ensure debug overhead is acceptable
          ./run_debug_tests --gtest_filter="*Performance*" --gtest_output=xml:debug_performance.xml
          echo "::endgroup::"
        continue-on-error: true

      - name: Verify test result files
        run: |
          echo "::group::Checking for generated test result files"
          ls -la ${GITHUB_WORKSPACE}/build/*.xml || echo "No XML files found"
          echo "::endgroup::"
        if: always()
        
      - name: Upload debug test results
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-results
          path: |
            build/debug_results.xml
            build/debug_performance.xml
        if: always()
        
      - name: Clean up virtual CAN interface
        run: |
          echo "::group::Cleaning up test environment"
          sudo ip link set down ${VCAN_IFNAME} || true
          sudo ip link delete ${VCAN_IFNAME} || true
          echo "::endgroup::"
        if: always()
